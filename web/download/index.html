<!doctype html>
<html lang="zh-CN">

  <style>
    :root { color-scheme: dark; --ink: #f8ebd4; --muted: #d0bed0; --gold: #e9bb78; --line: #b08a5569; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #10101b; font: 16px/1.65 system-ui, "Microsoft YaHei", sans-serif; }
    main { width: min(1120px, 100% - 40px); margin: auto; }
    header { min-height: 76px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; letter-spacing: .06em; font: 24px Georgia, serif; }
    .brand span { color: var(--gold); font-size: 29px; }
    .platform { color: var(--muted); font-size: 14px; }
    .hero { min-height: 520px; display: grid; grid-template-columns: 1.02fr .98fr; align-items: center; gap: clamp(25px, 5vw, 70px); padding: 48px 0; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(40px, 6vw, 76px); line-height: 1.14; letter-spacing: -.065em; }

    .lead { max-width: 28em; color: var(--muted); margin: 22px 0 26px; }
    .download { display: inline-flex; align-items: center; gap: 14px; padding: 12px 22px; border: 1px solid #ffe1a6; border-radius: 4px; background: linear-gradient(115deg,#f1ca91,#cf9654); color: #21121d; font-weight: 750; text-decoration: none; }
    .download:hover { background: #ffe0a8; }
    .download:focus-visible { outline: 2px solid white; outline-offset: 4px; }
    .metadata { margin-top: 10px; color: var(--muted); font-size: 13px; }
    .art { display: grid; place-items: center; position: relative; min-width: 0; aspect-ratio: 1; isolation: isolate; border: 1px solid var(--line); border-radius: 50% 50% 8px 8px; background: radial-gradient(ellipse at 50% 55%, #48283c 0%, #241b35 49%, #171323 78%); overflow: hidden; }
    .art::before { content: ""; position: absolute; inset: 13px; border-radius: inherit; border: 1px solid #b08a5538; }
    .wheel { width: 76%; aspect-ratio: 1; border: 1px solid var(--gold); border-radius: 50%; position: relative; display: grid; place-items: center; box-shadow: 0 0 40px #e9bb7820, inset 0 0 0 6px #21192d, inset 0 0 0 7px var(--line); }
    .wheel::before { content: ""; position: absolute; inset: 9%; border: 1px solid var(--line); border-radius: 50%; background: repeating-conic-gradient(from -1deg, #e9bb7899 0 1deg, transparent 1deg 15deg); mask: radial-gradient(farthest-side, transparent 92%, #000 93%); }
    .wheel::after { content: ""; position: absolute; inset: 18%; border: 1px solid var(--line); border-radius: 50%; }
    .sun { width: 57%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: repeating-conic-gradient(from -3deg,#d69c5b 0 3deg,transparent 3deg 15deg); }
    .sun::before { content: "✦"; display: grid; place-items: center; width: 66%; aspect-ratio: 1; color: #f7d394; font-size: clamp(30px, 8vw, 92px); line-height: 1; border: 1px solid #f7d394; border-radius: 50%; background: radial-gradient(#774649,#352039 74%); box-shadow: 0 0 0 8px #342238; }
    .star { position: absolute; color: var(--gold); font-size: clamp(12px, 2.7vw, 32px); }
    .star.a { top: 8%; left: 48%; } .star.b { left: 7%; top: 46%; } .star.c { right: 7%; top: 46%; } .star.d { bottom: 7%; left: 48%; }
    .instructions { border-block: 1px solid var(--line); padding: 24px 0 30px; margin-bottom: 34px; }
    h2 { font-size: 23px; }
    ol { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; padding-left: 1.4em; color: var(--muted); margin-bottom: 0; }

    .wechat { margin-top: 17px; color: var(--gold); font-size: 14px; }
    @media (max-width: 680px) {

      .art { max-width: 420px; width: 100%; justify-self: center; }
      .download { width: 100%; justify-content: center; }
      ol { grid-template-columns: 1fr; gap: 8px; }
    }
  </style>
</head>
<body>

        <a class="download" href="FaceScore.apk" download>下载 Android APK <span aria-hidden="true">↓</span></a>

</html>
